<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="./theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Zivo</title>
  <meta name="theme-color" content="#0f1419">
  <link rel="icon" href="./assets/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="x-page z-shell app-lock" data-nav="settings">
  <div class="z-app">
    <header id="zTopbar" class="z-topbar"></header>
    <div class="z-columns">
      <aside id="zLeft" class="z-rail z-rail-left"></aside>
      <main class="z-center">
        <div class="sticky top-0 z-30 flex items-center gap-4 border-b border-x-line bg-x-bg px-3 py-2">
          <a href="profile.html" class="rounded-lg p-2 hover:bg-x-hover" aria-label="Back">
            <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </a>
          <h1 class="flex-1 text-xl font-bold">Edit profile</h1>
          <button type="submit" form="settingsForm" class="x-btn-blue h-9 px-4 text-sm">Save</button>
        </div>

        <form id="settingsForm" class="z-card mt-4 pb-12">
          <div class="relative isolate">
            <div class="relative z-0 h-40 overflow-hidden bg-x-chip sm:h-52">
              <img id="coverImage" alt="" class="hidden h-full w-full object-cover">
              <input id="cover" type="file" accept="image/jpeg,image/png,image/gif,image/webp" class="sr-only">
              <label for="cover" id="coverLabel" class="absolute top-3 right-4 z-20 cursor-pointer rounded-lg bg-black/70 px-4 py-1.5 text-[15px] font-bold text-white hover:bg-black/80">Add cover</label>
            </div>
            <div class="pointer-events-none relative z-10 -mt-12 flex items-end justify-between px-4 sm:-mt-14">
              <div id="preview" class="pointer-events-auto rounded-full bg-x-panel p-1 ring-2 ring-x-panel"></div>
              <div class="pointer-events-auto mb-2 text-right">
                <input id="photo" type="file" accept="image/jpeg,image/png,image/gif,image/webp" class="sr-only">
                <label for="photo" class="inline-flex cursor-pointer rounded-lg border border-x-border bg-x-panel px-4 py-1.5 text-[15px] font-bold hover:bg-x-hover">Edit photo</label>
                <p id="photoName" class="mt-1 max-w-48 text-xs break-all text-x-muted"></p>
                <div id="photoSizes" class="hidden"></div>
              </div>
            </div>
          </div>

          <div id="coverSizes" class="hidden px-4"></div>
          <div class="px-4">
            <label class="mt-6 block">
              <span class="mb-1.5 block text-[13px] text-x-muted">Name</span>
              <input id="name" type="text" required class="x-input">
            </label>
            <label class="mt-4 block">
              <span class="mb-1.5 block text-[13px] text-x-muted">Bio</span>
              <textarea id="bio" rows="3" maxlength="160" class="x-input h-auto py-3" placeholder="Bio"></textarea>
              <span class="mt-1 block text-right text-[13px] text-x-muted"><span id="bioCount">0</span>/160</span>
            </label>
            <label class="mt-2 block">
              <span class="mb-1.5 block text-[13px] text-x-muted">Username</span>
              <input id="username" type="text" readonly class="x-input cursor-default bg-x-hover text-x-muted">
            </label>
            <label class="mt-4 block">
              <span class="mb-1.5 block text-[13px] text-x-muted">Email</span>
              <input id="email" type="email" readonly class="x-input cursor-default bg-x-hover text-x-muted">
            </label>
            <p id="notice" class="mt-4 hidden text-[15px]" role="status"></p>
          </div>
        </form>
      </main>
      <aside id="zRight" class="z-rail z-rail-right"></aside>
    </div>
  </div>

  <nav id="zBottom" class="z-bottom" aria-label="Mobile"></nav>
<script src="./api.js"></script>
  <script src="./image-file.js"></script>
  <script src="./shell.js"></script>
  <script>
    
    var shell = initShell({ nav: 'settings' });
const preview = document.getElementById('preview');
    const notice = document.getElementById('notice');

    function picture(src, letter) {
      preview.innerHTML = '';
      if (src) {
        const img = document.createElement('img');
        img.src = src.indexOf('blob:') === 0 || src.indexOf('data:') === 0 ? src : API + src;
        img.alt = '';
        img.className = 'size-28 rounded-full bg-x-chip object-cover sm:size-32';
        preview.appendChild(img);
        return img;
      }
      const fallback = document.createElement('span');
      fallback.className = 'flex size-28 items-center justify-center rounded-full bg-x-blue text-3xl font-bold text-white sm:size-32';
      fallback.textContent = (letter || '?').toUpperCase();
      preview.appendChild(fallback);
      return fallback;
    }

    function showCover(src) {
      const img = document.getElementById('coverImage');
      const label = document.getElementById('coverLabel');
      if (!src) {
        img.classList.add('hidden');
        img.removeAttribute('src');
        label.textContent = 'Add cover';
        return;
      }
      img.src = src.indexOf('blob:') === 0 || src.indexOf('data:') === 0 ? src : API + src;
      img.classList.remove('hidden');
      label.textContent = 'Edit cover';
    }

    function showNotice(text, ok) {
      notice.classList.remove('hidden');
      notice.className = ok ? 'mt-4 text-[15px] font-medium text-x-blue' : 'mt-4 text-[15px] font-medium text-x-danger';
      notice.textContent = text;
    }

    function updateCount() {
      document.getElementById('bioCount').textContent = String(document.getElementById('bio').value.length);
    }

    if (!requireAuth()) {
      // redirected to sign in
    } else {
      apiFetch('/me')
        .then(function (result) {
          if (!result.ok) return;
          document.getElementById('name').value = result.data.name;
          document.getElementById('bio').value = result.data.bio || '';
          document.getElementById('username').value = result.data.username ? '@' + result.data.username : '';
          document.getElementById('email').value = result.data.email || '';
          shell.paintProfile(result.data);
          picture(result.data.photo, result.data.name.charAt(0));
          showCover(result.data.cover);
          updateCount();
        })
        .catch(function () {
          window.location.href = 'loginpage.html';
        });
    }

    document.getElementById('bio').addEventListener('input', updateCount);

    var photoOriginal = null;
    var photoPrepared = null;
    var photoJob = Promise.resolve();
    var photoToken = 0;
    var coverOriginal = null;
    var coverPrepared = null;
    var coverJob = Promise.resolve();
    var coverToken = 0;

    function cropAction(box, onClick) {
      box.className = 'mt-2';
      box.innerHTML = '';
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Crop';
      button.style.cssText = 'height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--color-x-border);background:transparent;color:var(--color-x-ink);font:700 13px/1 Inter,sans-serif;cursor:pointer;';
      button.addEventListener('click', onClick);
      box.appendChild(button);
    }

    function cropPhoto() {
      if (!photoOriginal || imageKind(photoOriginal) === 'image/gif') return Promise.resolve();
      return openImageCrop(photoOriginal, { title: 'Crop photo', circle: true }).then(function (file) {
        if (!file) return;
        photoPrepared = file;
        document.getElementById('photoName').textContent = file.name;
        picture(URL.createObjectURL(file), '');
      });
    }

    function cropCoverImage() {
      if (!coverOriginal || imageKind(coverOriginal) === 'image/gif') return Promise.resolve();
      return openImageCrop(coverOriginal, {
        title: 'Crop cover',
        aspects: [
          { id: 'wide', label: 'Wide', ratio: 3 },
          { id: 'original', label: 'Original' },
        ],
      }).then(function (file) {
        if (!file) return;
        coverPrepared = file;
        showCover(URL.createObjectURL(file));
      });
    }

    function fitPhoto() {
      var token = photoToken + 1;
      photoToken = token;
      var box = document.getElementById('photoSizes');
      if (!photoOriginal || imageKind(photoOriginal) === 'image/gif') {
        box.classList.add('hidden');
        box.innerHTML = '';
        photoPrepared = photoOriginal;
        photoJob = Promise.resolve();
        if (photoOriginal) picture(URL.createObjectURL(photoOriginal), '');
        return Promise.resolve();
      }
      cropAction(box, function () { cropPhoto(); });
      photoJob = resizeImageFile(photoOriginal, 1600).then(function (file) {
        if (token !== photoToken) return;
        photoPrepared = file;
        document.getElementById('photoName').textContent = file.name;
        picture(URL.createObjectURL(file), '');
        return cropPhoto();
      });
      return photoJob;
    }

    function fitCover() {
      var token = coverToken + 1;
      coverToken = token;
      var box = document.getElementById('coverSizes');
      if (!coverOriginal || imageKind(coverOriginal) === 'image/gif') {
        box.classList.add('hidden');
        box.innerHTML = '';
        coverPrepared = coverOriginal;
        coverJob = Promise.resolve();
        if (coverOriginal) showCover(URL.createObjectURL(coverOriginal));
        return Promise.resolve();
      }
      cropAction(box, function () { cropCoverImage(); });
      coverJob = resizeImageFile(coverOriginal, 1600).then(function (file) {
        if (token !== coverToken) return;
        coverPrepared = file;
        showCover(URL.createObjectURL(file));
        return cropCoverImage();
      });
      return coverJob;
    }

    document.getElementById('cover').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      var problem = imageFileProblem(file);
      if (problem) {
        this.value = '';
        showNotice(problem, false);
        return;
      }
      coverOriginal = file;
      showNotice('', true);
      document.getElementById('notice').classList.add('hidden');
      fitCover();
    });

    document.getElementById('photo').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      var problem = imageFileProblem(file);
      if (problem) {
        this.value = '';
        document.getElementById('photoName').textContent = '';
        showNotice(problem, false);
        return;
      }
      document.getElementById('photoName').textContent = file.name;
      photoOriginal = file;
      showNotice('', true);
      document.getElementById('notice').classList.add('hidden');
      fitPhoto();
    });

    document.getElementById('settingsForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const form = new FormData();
      form.append('name', document.getElementById('name').value);
      form.append('bio', document.getElementById('bio').value);
      const photoProblem = imageFileProblem(document.getElementById('photo').files[0]);
      const coverProblem = imageFileProblem(document.getElementById('cover').files[0]);
      if (photoProblem || coverProblem) {
        showNotice(photoProblem || coverProblem, false);
        return;
      }

      Promise.all([photoJob, coverJob]).then(function () {
      if (photoPrepared) form.append('photo', photoPrepared);
      if (coverPrepared) form.append('cover', coverPrepared);

      return apiForm('/settings', form)
        .then(function (result) {
          if (!result.ok) {
            showNotice(result.data.message || 'Could not save that.', false);
            return;
          }
          picture(result.data.photo, result.data.name.charAt(0));
          shell.paintProfile(result.data);
          window.location.href = 'profile.html';
        })
        .catch(function () {
          showNotice('Cannot reach the server.', false);
        });
      });
    });
  </script>
</body>
</html>
