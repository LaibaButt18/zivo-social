<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="./theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New password | Zivo</title>
  <meta name="theme-color" content="#0f1419">
  <link rel="icon" href="./assets/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="x-page z-shell">
  <div class="mx-auto flex min-h-svh w-full max-w-[600px] flex-col px-8 py-6 sm:px-16">
    <div class="mb-6 flex items-center justify-between" data-theme-host>
      <a href="forgetpassword.html" class="w-fit rounded-full p-2 hover:bg-x-hover" aria-label="Back">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
    </div>
    <span class="mb-6 inline-flex items-center gap-2.5">
      <img src="./assets/logo-mark.svg" alt="" class="size-8">
      <span class="text-[22px] font-extrabold leading-none tracking-[-0.03em]">Zivo</span>
    </span>
    <h1 class="text-[31px] leading-9 font-extrabold">Choose a new password</h1>
    <p class="mt-2 text-[15px] leading-5 text-x-muted">Make sure it's 8 characters or more.</p>
    <form id="resetForm" class="mt-8 space-y-5">
      <label class="block">
        <span class="mb-1.5 block text-[15px] font-medium">New password</span>
        <input id="password" type="password" placeholder="New password" autocomplete="new-password" minlength="8" required class="x-input">
      </label>
      <label class="block">
        <span class="mb-1.5 block text-[15px] font-medium">Confirm password</span>
        <input id="password-confirm" type="password" placeholder="Confirm password" autocomplete="new-password" minlength="8" required class="x-input">
      </label>
      <button type="submit" class="x-btn">Change password</button>
      <div id="notice" class="hidden text-[15px] leading-5 text-x-ink" role="status"></div>
    </form>
    <p class="mt-10 text-[15px] text-x-muted">
      <a href="forgetpassword.html" class="x-link">Need a new link?</a>
      <span class="mx-2">·</span>
      <a href="loginpage.html" class="x-link">Sign in</a>
    </p>
  </div>
  <script src="./api.js"></script>
  <script>
    const resetToken = new URLSearchParams(window.location.search).get('token') || '';
    const notice = document.getElementById('notice');
    if (!resetToken) {
      notice.className = 'text-[15px] leading-5 text-x-danger';
      notice.textContent = 'Open the reset link from your email.';
    }

    document.getElementById('resetForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const a = document.getElementById('password').value;
      const b = document.getElementById('password-confirm').value;
      notice.classList.remove('hidden');
      if (!resetToken) {
        notice.className = 'text-[15px] leading-5 text-x-danger';
        notice.textContent = 'Open the reset link from your email.';
        return;
      }
      if (a !== b) {
        notice.className = 'text-[15px] leading-5 text-x-danger';
        notice.textContent = 'Passwords do not match. Try again.';
        return;
      }
      const button = e.target.querySelector('button');
      button.disabled = true;
      apiFetch('/reset', {
        method: 'POST',
        body: JSON.stringify({ token: resetToken, password: a }),
      })
        .then(function (result) {
          button.disabled = false;
          if (!result.ok) {
            notice.className = 'text-[15px] leading-5 text-x-danger';
            notice.textContent = result.data.message || 'Could not change that password.';
            return;
          }
          window.location.href = 'loginpage.html';
        })
        .catch(function () {
          button.disabled = false;
          notice.className = 'text-[15px] leading-5 text-x-danger';
          notice.textContent = 'Cannot reach the server.';
        });
    });
  </script>
</body>
</html>
