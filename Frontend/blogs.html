<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="./theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogs | Zivo</title>
  <meta name="theme-color" content="#0f1419">
  <link rel="icon" href="./assets/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="x-page z-shell app-lock" data-nav="blogs">
  <div class="z-app">
    <header id="zTopbar" class="z-topbar"></header>
    <div class="z-columns">
      <aside id="zLeft" class="z-rail z-rail-left"></aside>
      <main class="z-center">
      <div class="sticky top-0 z-20 border-b border-x-line bg-x-bg/90 px-4 py-3 backdrop-blur-md">
        <h1 class="text-xl font-extrabold">Blogs</h1>
        <label class="mt-3 block">
          <span class="sr-only">Search blogs</span>
          <input id="blogSearch" type="search" placeholder="Search blogs" class="h-10 w-full rounded-full border border-transparent bg-x-chip px-4 text-[15px] outline-none placeholder:text-x-muted focus:border-x-blue focus:bg-x-panel">
        </label>
      </div>

      <form id="blogForm" class="border-b border-x-line px-4 py-4">
        <label class="block">
          <span class="sr-only">Title</span>
          <input id="blogTitle" maxlength="80" placeholder="Title" class="w-full bg-transparent text-xl font-bold outline-none placeholder:font-normal placeholder:text-x-muted">
        </label>
        <label class="mt-2 block">
          <span class="sr-only">Blog</span>
          <textarea id="blogBody" rows="5" maxlength="4000" placeholder="Write your blog" class="w-full resize-none bg-transparent text-[17px] leading-6 outline-none placeholder:text-x-muted"></textarea>
        </label>
        <div id="coverFrame" class="relative mt-3 hidden">
          <img id="coverPreview" alt="" class="max-h-72 w-full rounded-2xl border border-x-line bg-black object-contain">
        </div>
        <div class="mt-3 flex items-center justify-between border-t border-x-line pt-3">
          <div class="flex items-center gap-2">
            <input id="blogCover" type="file" accept="image/jpeg,image/png,image/gif,image/webp" class="sr-only">
            <label for="blogCover" class="inline-flex size-9 cursor-pointer items-center justify-center rounded-full text-x-blue hover:bg-x-blue/10" aria-label="Add cover">
              <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.3"/><path stroke-linecap="round" stroke-linejoin="round" d="m21 15.5-4.2-4.2L8 19"/></svg>
            </label>
            <span id="coverName" class="max-w-40 truncate text-[13px] text-x-muted"></span>
          </div>
          <button id="blogSubmit" type="submit" class="h-9 cursor-not-allowed rounded-full bg-x-blue/50 px-4 text-[15px] font-bold text-white" disabled>Publish</button>
        </div>
        <p id="blogNotice" class="mt-2 hidden text-[13px] text-x-danger" role="status"></p>
      </form>

      <div id="blogList"></div>
      <p id="blogEmpty" class="hidden px-4 py-10 text-center text-[15px] text-x-muted">No blogs yet. Write the first one.</p>
    </main>
      <aside id="zRight" class="z-rail z-rail-right"></aside>
    </div>
  </div>

  <nav id="zBottom" class="z-bottom" aria-label="Mobile"></nav>
<script src="./api.js"></script>
  <script src="./image-file.js"></script>
  <script src="./shell.js"></script>
  <script>
    
    var shell = initShell({ nav: 'blogs' });
var blogs = [];
    var query = "";
    var meEmail = "";

    function picture(src, letter, sizeClass) {
      if (src) {
        var img = document.createElement("img");
        img.src = API + src;
        img.alt = "";
        img.className = "size-10 shrink-0 rounded-full object-cover " + (sizeClass || "");
        return img;
      }
      var fallback = document.createElement("span");
      fallback.className = "flex size-10 shrink-0 items-center justify-center rounded-full bg-x-blue text-sm font-bold text-white";
      fallback.textContent = (letter || "?").toUpperCase();
      return fallback;
    }

    function when(seconds) {
      if (!seconds) return "";
      return new Date(seconds * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }

    function notice(text) {
      var el = document.getElementById("blogNotice");
      if (!text) {
        el.classList.add("hidden");
        el.textContent = "";
        return;
      }
      el.classList.remove("hidden");
      el.textContent = text;
    }

    var coverOriginal = null;
    var coverPrepared = null;
    var coverUrl = "";
    var coverJob = Promise.resolve();
    var coverToken = 0;
    var coverCrop = makeCropButton();
    document.getElementById("coverFrame").appendChild(coverCrop);
    coverCrop.addEventListener("click", function () { cropCover(); });

    function imageProblem(file) {
      return imageFileProblem(file);
    }

    function syncButton() {
      var ready = document.getElementById("blogTitle").value.trim() && document.getElementById("blogBody").value.trim();
      var button = document.getElementById("blogSubmit");
      button.disabled = false;
      button.className = ready
        ? "x-btn-blue h-9 px-4 text-[15px]"
        : "h-9 rounded-full bg-x-blue/50 px-4 text-[15px] font-bold text-white";
    }

    function clearCover() {
      coverOriginal = null;
      coverPrepared = null;
      if (coverUrl) URL.revokeObjectURL(coverUrl);
      coverUrl = "";
      document.getElementById("coverName").textContent = "";
      var preview = document.getElementById("coverPreview");
      preview.removeAttribute("src");
      document.getElementById("coverFrame").classList.add("hidden");
      coverCrop.classList.add("hidden");
    }

    function showCoverFile(file) {
      coverPrepared = file;
      if (coverUrl) URL.revokeObjectURL(coverUrl);
      coverUrl = URL.createObjectURL(file);
      document.getElementById("coverPreview").src = coverUrl;
      document.getElementById("coverFrame").classList.remove("hidden");
      coverCrop.classList.toggle("hidden", imageKind(coverOriginal) === "image/gif");
      document.getElementById("coverName").textContent = file.name;
    }

    function cropCover() {
      if (!coverOriginal || imageKind(coverOriginal) === "image/gif") return Promise.resolve();
      return openImageCrop(coverOriginal, {
        title: "Crop",
        aspects: [
          { id: "wide", label: "Wide", ratio: 16 / 9 },
          { id: "original", label: "Original" },
          { id: "square", label: "Square", ratio: 1 },
        ],
      }).then(function (file) {
        if (file) showCoverFile(file);
      });
    }

    function refreshCover() {
      var token = coverToken + 1;
      coverToken = token;
      if (!coverOriginal) {
        clearCover();
        return Promise.resolve();
      }
      if (imageKind(coverOriginal) === "image/gif") {
        coverJob = Promise.resolve();
        showCoverFile(coverOriginal);
        return coverJob;
      }
      coverJob = resizeImageFile(coverOriginal, 1600).then(function (file) {
        if (token !== coverToken) return;
        showCoverFile(file);
      });
      return coverJob;
    }

    function paint() {
      var box = document.getElementById("blogList");
      box.innerHTML = "";
      var shown = blogs.filter(function (blog) {
        if (!query) return true;
        var hay = (blog.title + " " + blog.excerpt + " " + blog.name + " " + (blog.username || "")).toLowerCase();
        return hay.indexOf(query) !== -1;
      });
      document.getElementById("blogEmpty").classList.toggle("hidden", shown.length > 0);
      shown.forEach(function (blog) {
        var link = document.createElement("a");
        link.href = "blog.html?id=" + encodeURIComponent(blog.id);
        link.className = "block border-b border-x-line px-4 py-4 hover:bg-x-hover";
        var who = document.createElement("div");
        who.className = "flex items-center gap-3";
        who.appendChild(picture(blog.photo, (blog.name || "?").charAt(0)));
        var copy = document.createElement("div");
        copy.className = "min-w-0";
        var name = document.createElement("p");
        name.className = "truncate text-[15px] font-bold";
        name.textContent = blog.name;
        var meta = document.createElement("p");
        meta.className = "truncate text-[13px] text-x-muted";
        meta.textContent = (blog.username ? "@" + blog.username + " · " : "") + when(blog.created_at);
        copy.appendChild(name);
        copy.appendChild(meta);
        who.appendChild(copy);
        link.appendChild(who);
        var title = document.createElement("h2");
        title.className = "mt-3 text-[19px] font-extrabold leading-6";
        title.textContent = blog.title;
        link.appendChild(title);
        if (blog.excerpt) {
          var excerpt = document.createElement("p");
          excerpt.className = "mt-1 text-[15px] leading-5 text-x-ink";
          excerpt.textContent = blog.excerpt;
          link.appendChild(excerpt);
        }
        if (blog.cover) {
          var cover = document.createElement("img");
          cover.src = API + blog.cover;
          cover.alt = "";
          cover.className = "mt-3 max-h-72 w-full rounded-2xl border border-x-line object-cover";
          link.appendChild(cover);
        }
        var stats = document.createElement("p");
        stats.className = "mt-3 text-[13px] text-x-muted";
        var likes = blog.like_count || 0;
        var comments = blog.comment_count || 0;
        stats.textContent = likes + (likes === 1 ? " like" : " likes") + " · " + comments + (comments === 1 ? " comment" : " comments");
        link.appendChild(stats);
        box.appendChild(link);
      });
    }

    function loadBlogs() {
      return apiFetch("/blogs").then(function (result) {
        if (result.status === 401) return;
        blogs = Array.isArray(result.data) ? result.data : [];
        paint();
      });
    }

    if (!requireAuth()) {
      // redirected to sign in
    } else {
      apiFetch("/me").then(function (result) {
        if (!result.ok) return;
        meEmail = result.data.email || "";
        shell.paintProfile(result.data);
        if (result.data.username) document.getElementById("handle").textContent = "@" + result.data.username;
        return loadBlogs();
      }).catch(function () {
        window.location.href = "loginpage.html";
      });
    }

    document.getElementById("blogSearch").addEventListener("input", function () {
      query = this.value.trim().toLowerCase();
      paint();
    });
    document.getElementById("blogTitle").addEventListener("input", syncButton);
    document.getElementById("blogBody").addEventListener("input", syncButton);
    syncButton();
    document.getElementById("blogCover").addEventListener("change", function () {
      var file = this.files[0];
      var problem = imageProblem(file);
      if (problem) {
        this.value = "";
        clearCover();
        notice(problem);
        return;
      }
      notice("");
      if (!file) {
        clearCover();
        return;
      }
      coverOriginal = file;
      document.getElementById("coverName").textContent = file.name;
      refreshCover().then(function () {
        if (imageKind(file) !== "image/gif") return cropCover();
      });
    });
    document.getElementById("blogForm").addEventListener("submit", function (event) {
      event.preventDefault();
      var title = document.getElementById("blogTitle").value.trim();
      var body = document.getElementById("blogBody").value.trim();
      var file = document.getElementById("blogCover").files[0];
      var problem = imageProblem(file);
      if (!title || !body) {
        notice("Add a title and write the blog.");
        return;
      }
      if (problem) {
        notice(problem);
        return;
      }
      var button = document.getElementById("blogSubmit");
      button.disabled = true;
      coverJob.then(function () {
      var form = new FormData();
      form.append("title", title);
      form.append("body", body);
      if (coverPrepared) form.append("cover", coverPrepared);
      return apiForm("/blogs", form);
      }).then(function (result) {
        syncButton();
        if (!result.ok) {
          notice(result.data.message || "Could not publish that blog.");
          return;
        }
        window.location.href = "blog.html?id=" + encodeURIComponent(result.data.id);
      }).catch(function () {
        syncButton();
        notice("Cannot reach the server.");
      });
    });
</script>
</body>
</html>
