<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="./theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | Zivo</title>
  <meta name="theme-color" content="#0f1419">
  <link rel="icon" href="./assets/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="x-page z-shell app-lock" data-nav="notifications">
  <div class="z-app">
    <header id="zTopbar" class="z-topbar"></header>
    <div class="z-columns">
      <aside id="zLeft" class="z-rail z-rail-left"></aside>
      <main class="z-center">
      <div class="sticky top-0 z-20 flex items-center justify-between gap-3 border-b border-x-line bg-x-bg/90 px-4 py-3 backdrop-blur-md">
        <h1 class="text-xl font-extrabold">Notifications</h1>
        <button id="markRead" type="button" class="rounded-full px-3 py-1.5 text-[13px] font-bold text-x-blue hover:bg-x-blue/10">Mark all read</button>
      </div>
      <div id="notes" class="z-list mt-4"></div>
      <p id="empty" class="hidden px-4 py-10 text-center text-[15px] text-x-muted">No notifications yet.</p>
    </main>
      <aside id="zRight" class="z-rail z-rail-right"></aside>
    </div>
  </div>

  <nav id="zBottom" class="z-bottom" aria-label="Mobile"></nav>
<script src="./api.js"></script>
  <script src="./shell.js"></script>
  <script>
    
    var shell = initShell({ nav: 'notifications' });
var notes = [];

    function picture(src, letter) {
      if (src) {
        var img = document.createElement("img");
        img.src = API + src;
        img.alt = "";
        img.className = "size-10 shrink-0 rounded-full object-cover";
        return img;
      }
      var fallback = document.createElement("span");
      fallback.className = "flex size-10 shrink-0 items-center justify-center rounded-full bg-x-blue text-sm font-bold text-white";
      fallback.textContent = (letter || "?").toUpperCase();
      return fallback;
    }

    function ago(seconds) {
      if (!seconds) return "";
      var delta = Math.floor(Date.now() / 1000 - seconds);
      if (delta < 60) return "Just now";
      if (delta < 3600) return Math.floor(delta / 60) + "m";
      if (delta < 86400) return Math.floor(delta / 3600) + "h";
      return Math.floor(delta / 86400) + "d";
    }

    var NOTE_ICONS = {
      like: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19.2s-6.2-3.8-6.2-8.1A3.5 3.5 0 0 1 12 8.4a3.5 3.5 0 0 1 6.2 2.7c0 4.3-6.2 8.1-6.2 8.1z"/></svg>',
      comment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 8.4h8M8 11.6h5"/><path stroke-linecap="round" stroke-linejoin="round" d="M6.2 5.8h11.6A1.6 1.6 0 0 1 19.4 7.4v6.2a1.6 1.6 0 0 1-1.6 1.6H9.2L6.2 18v-2.8A1.6 1.6 0 0 1 4.6 13.6V7.4a1.6 1.6 0 0 1 1.6-1.6z"/></svg>',
      follow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="8.2" r="2.6"/><path stroke-linecap="round" d="M4.6 18.6c1-2.2 2.8-3.4 5.4-3.4s4.4 1.2 5.4 3.4"/><path stroke-linecap="round" d="M18 8v4.2M15.9 10.1h4.2"/></svg>',
      friend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" d="M15.2 19.2v-1c0-1.8-1.8-3.2-4-3.2s-4 1.4-4 3.2v1"/><circle cx="11.2" cy="8.3" r="2.6"/><path stroke-linecap="round" d="M18.8 19.2v-.8c0-1.3-1-2.4-2.3-2.8"/><circle cx="16.6" cy="9.2" r="2"/></svg>',
      group: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" d="M15.2 19.2v-1c0-1.8-1.8-3.2-4-3.2s-4 1.4-4 3.2v1"/><circle cx="11.2" cy="8.3" r="2.6"/><path stroke-linecap="round" d="M18.8 19.2v-.8c0-1.3-1-2.4-2.3-2.8"/><circle cx="16.6" cy="9.2" r="2"/></svg>',
      chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.2 7.2h11.6A1.6 1.6 0 0 1 19.4 8.8v6a1.6 1.6 0 0 1-1.6 1.6H9.4L6.2 19.2v-2.8A1.6 1.6 0 0 1 4.6 14.8v-6a1.6 1.6 0 0 1 1.6-1.6z"/></svg>',
      webinar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.4" y="6.6" width="11.2" height="8.2" rx="1.8"/><path stroke-linecap="round" stroke-linejoin="round" d="m14.6 9.8 5.2-2.3v6.4l-5.2-2.3"/></svg>',
      blog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5.2 5.2h4.4A2.4 2.4 0 0 1 12 7.6v11.2a2 2 0 0 0-2-2H5.2z"/><path stroke-linecap="round" stroke-linejoin="round" d="M18.8 5.2h-4.4A2.4 2.4 0 0 0 12 7.6v11.2a2 2 0 0 1 2-2h4.8z"/></svg>',
      note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.4 9.2a5.6 5.6 0 0 1 11.2 0c0 4.2 1.3 5.6 1.3 5.6H5.1s1.3-1.4 1.3-5.6z"/><path stroke-linecap="round" d="M10 18.2a2 2 0 0 0 4 0"/></svg>'
    };

    function noteKind(note) {
      if (NOTE_ICONS[note.kind]) return note.kind;
      var text = (note.text || "").toLowerCase();
      if (text.indexOf("liked") !== -1) return "like";
      if (text.indexOf("replied") !== -1 || text.indexOf("commented") !== -1) return "comment";
      if (text.indexOf("following") !== -1) return "follow";
      if (text.indexOf("friend") !== -1) return "friend";
      if (text.indexOf("webinar") !== -1 || text.indexOf("invited you") !== -1) return "webinar";
      if (text.indexOf("blog") !== -1 || text.indexOf("published") !== -1) return "blog";
      if (text.indexOf("chat") !== -1) return "chat";
      if (text.indexOf("group") !== -1 || text.indexOf("join") !== -1) return "group";
      return "note";
    }

    function paint() {
      var box = document.getElementById("notes");
      box.innerHTML = "";
      document.getElementById("empty").classList.toggle("hidden", notes.length > 0);
      notes.forEach(function (note) {
        var row = document.createElement(note.href ? "a" : "div");
        if (note.href) row.href = note.href;
        row.className = "flex items-center gap-3 border-b border-x-line px-4 py-3.5 " + (note.read ? "hover:bg-x-hover" : "bg-x-blue/10 hover:bg-x-blue/15");
        var kind = noteKind(note);
        var icon = document.createElement("span");
        icon.className = "z-note-icon";
        icon.dataset.kind = kind;
        icon.innerHTML = NOTE_ICONS[kind];
        if (!note.read) {
          var dot = document.createElement("span");
          dot.className = "z-note-dot";
          icon.appendChild(dot);
        }
        var copy = document.createElement("div");
        copy.className = "min-w-0 flex-1";
        var text = document.createElement("p");
        text.className = "text-[15px] leading-5";
        text.textContent = note.text;
        var time = document.createElement("p");
        time.className = "mt-0.5 text-[13px] text-x-muted";
        time.textContent = ago(note.created_at);
        copy.appendChild(text);
        copy.appendChild(time);
        row.appendChild(icon);
        row.appendChild(copy);
        if (note.href) {
          row.addEventListener("click", function () {
            if (!note.read) {
              apiFetch("/notifications/read", { method: "POST", body: JSON.stringify({ id: note.id }) });
            }
          });
        }
        box.appendChild(row);
      });
    }

    function loadNotes() {
      return apiFetch("/notifications").then(function (result) {
        if (result.status === 401) return;
        notes = Array.isArray(result.data) ? result.data : [];
        paint();
        if (notes.some(function (note) { return !note.read; })) {
          apiFetch("/notifications/read", { method: "POST", body: "{}" }).then(function () {
            refreshNotifyBadge();
          });
        }
      });
    }

    if (!requireAuth()) {
      // redirected to sign in
    } else {
      apiFetch("/me").then(function (result) {
        if (!result.ok) return;
        shell.paintProfile(result.data);
        if (result.data.username) document.getElementById("handle").textContent = "@" + result.data.username;
        return loadNotes();
      }).catch(function () {
        window.location.href = "loginpage.html";
      });
    }

    document.getElementById("markRead").addEventListener("click", function () {
      apiFetch("/notifications/read", { method: "POST", body: "{}" }).then(function (result) {
        if (!result.ok) return;
        notes.forEach(function (note) { note.read = true; });
        paint();
        refreshNotifyBadge();
      });
    });
</script>
</body>
</html>
