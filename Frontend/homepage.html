<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zivo</title>
  <meta name="description" content="See what's happening. Post a note or a photo and follow people you know.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="./assets/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="x-page flex min-h-svh flex-col">
  <div class="relative flex w-full flex-1 flex-col lg:flex-row">
    <div class="flex items-center justify-center px-8 pt-10 lg:w-1/2 lg:pt-0">
      <span class="inline-flex items-center gap-3 sm:gap-4 lg:gap-5">
        <img src="./assets/logo-mark.svg" alt="" class="size-14 sm:size-20 lg:size-28">
        <span class="text-5xl font-extrabold tracking-[-0.04em] sm:text-7xl lg:text-8xl">Zivo</span>
      </span>
    </div>

    <main class="flex flex-1 flex-col justify-center px-8 py-10 sm:px-14 lg:py-16">
      <h1 class="max-w-[12ch] text-[40px] leading-[1.15] font-extrabold tracking-[-0.03em] sm:text-[64px]">Happening now</h1>
      <h2 class="mt-10 text-[23px] font-extrabold sm:mt-12 sm:text-[31px]">Join today.</h2>
      <div class="mt-8 flex w-full max-w-[300px] flex-col gap-4">
        <a href="signup.html" class="x-btn-blue h-10 text-[15px]">Create account</a>
        <p class="text-[11px] leading-4 text-x-muted">By signing up, you agree to the Terms of Service and Privacy Policy, including Cookie Use.</p>
        <p class="mt-3 text-[17px] font-bold">Already have an account?</p>
        <a href="loginpage.html" class="x-btn-outline h-10 text-[15px]">Sign in</a>
      </div>
    </main>
  </div>
  <footer class="mt-auto flex flex-wrap justify-center gap-x-4 gap-y-1 px-6 py-4 text-[13px] text-x-muted">
    <span>About</span>
    <span>Help</span>
    <span>Terms</span>
    <span>Privacy</span>
    <span>© 2026 Zivo</span>
  </footer>
</body>
</html>
