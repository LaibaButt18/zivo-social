          <span class="hidden min-w-0 flex-1 lg:block">
            <span id="greeting" class="block truncate text-[15px] font-bold">Account</span>
            <span id="handle" class="block truncate text-[15px] text-x-muted"></span>
          </span>
          <svg viewBox="0 0 24 24" class="hidden size-5 shrink-0 lg:block" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>

    <div class="flex h-svh min-w-0 flex-1 flex-col overflow-hidden border-x-line pb-14 sm:border-x sm:pb-0 lg:flex-row">
      <section class="flex min-h-0 min-w-0 flex-1 flex-col">
        <div class="flex items-center justify-between gap-3 border-b border-x-line px-6 py-4">
          <div class="min-w-0">
            <h1 id="roomTitle" class="truncate text-xl font-extrabold">Webinar</h1>
            <p id="countLabel" class="text-[13px] text-x-muted"></p>
          </div>
          <a href="webinars.html" class="shrink-0 rounded-full px-3 py-1.5 text-[15px] font-bold text-x-muted hover:bg-black/5">Back</a>
        </div>

        <div id="lobby" class="min-h-0 flex-1 overflow-y-auto px-6 py-6" data-show="min-h-0 flex-1 overflow-y-auto px-6 py-6">
          <div class="mx-auto flex w-full max-w-3xl flex-col">
            <img id="lobbyCover" alt="" class="mb-4 hidden h-40 w-full rounded-2xl border border-x-line object-cover">
            <h2 id="lobbyTitle" class="sr-only">Webinar</h2>
            <p id="lobbyHost" class="text-[15px] font-bold"></p>
            <p id="lobbyWhen" class="mt-0.5 text-[15px] text-x-muted"></p>
            <p id="lobbyAbout" class="mt-2 max-w-xl text-[15px] leading-5 text-x-muted"></p>
            <p id="lobbyNotice" class="mt-3 hidden text-[13px] text-x-danger" role="status"></p>
            <div id="previewWrap" class="hidden" data-show="relative mt-4 aspect-video w-full overflow-hidden rounded-2xl bg-black">
              <video id="previewVideo" class="absolute inset-0 hidden h-full w-full object-cover" autoplay muted playsinline></video>
            </div>
            <div class="mt-4 flex flex-wrap gap-2">
              <button id="goLive" type="button" class="hidden" data-show="x-btn-blue h-11 px-6 text-[15px]">Go live</button>
              <button id="joinLive" type="button" class="hidden" data-show="x-btn-blue h-11 px-6 text-[15px]">Join</button>
              <button id="startAgain" type="button" class="hidden" data-show="x-btn-blue h-11 px-6 text-[15px]">Start again</button>
            </div>
          </div>
        </div>

        <div id="liveView" class="hidden" data-show="flex min-h-0 flex-1 flex-col">
          <div class="relative min-h-[280px] flex-1 bg-[#0f1419] p-4">
            <div id="stageGrid" class="grid h-full min-h-0 gap-3"></div>
            <div id="floaters" class="pointer-events-none absolute inset-0"></div>
            <div id="stageBanner" class="hidden">
              <p id="stageText" class="text-[15px] font-bold text-white"></p>
              <button id="retryStage" type="button" class="hidden">Try again</button>
            </div>
          </div>
          <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3 border-t border-x-line px-4 py-3">
            <div></div>
            <div class="flex flex-wrap items-center justify-center gap-2">
              <button id="micButton" type="button" class="hidden" aria-label="Mute" data-show="inline-flex size-11 items-center justify-center rounded-full border border-x-border text-x-ink hover:bg-x-hover">
                <svg data-on viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3.5" width="6" height="10" rx="3"/><path stroke-linecap="round" d="M6.5 11a5.5 5.5 0 0 0 11 0M12 16.5V20M9 20h6"/></svg>
                <svg data-off viewBox="0 0 24 24" class="hidden size-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3.5" width="6" height="10" rx="3"/><path stroke-linecap="round" d="M6.5 11a5.5 5.5 0 0 0 11 0M12 16.5V20M9 20h6M5 5l14 14"/></svg>
              </button>
              <button id="cameraButton" type="button" class="hidden" aria-label="Camera off" data-show="inline-flex size-11 items-center justify-center rounded-full border border-x-border text-x-ink hover:bg-x-hover">
                <svg data-on viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2.5" y="6.5" width="12" height="9" rx="2"/><path stroke-linecap="round" stroke-linejoin="round" d="m14.5 9.5 6-2.5v8l-6-2.5"/></svg>
                <svg data-off viewBox="0 0 24 24" class="hidden size-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2.5" y="6.5" width="12" height="9" rx="2"/><path stroke-linecap="round" stroke-linejoin="round" d="m14.5 9.5 6-2.5v8l-6-2.5M4 4l16 16"/></svg>
              </button>
              <button id="shareButton" type="button" class="hidden" aria-label="Share screen" data-show="inline-flex size-11 items-center justify-center rounded-full border border-x-border text-x-ink hover:bg-x-hover">
                <svg data-on viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 9.5v5M9.5 12 12 9.5 14.5 12M8 20h8"/></svg>
                <svg data-off viewBox="0 0 24 24" class="hidden size-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path stroke-linecap="round" d="M8 20h8M9 10l6 6M15 10l-6 6"/></svg>
              </button>
              <button id="handButton" type="button" class="hidden" aria-label="Raise hand" data-show="inline-flex size-11 items-center justify-center rounded-full border border-x-border text-x-ink hover:bg-x-hover">
                <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 11V6.5a1.5 1.5 0 0 1 3 0V11"/><path stroke-linecap="round" stroke-linejoin="round" d="M11 10.5V5.5a1.5 1.5 0 0 1 3 0v5.5"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 10.2V7a1.5 1.5 0 0 1 3 0v6.2c0 3.2-2 5.8-5.2 5.8-2.4 0-3.8-1.2-4.8-2.6L5.2 13a1.4 1.4 0 0 1 2.2-1.6L8 12.2"/></svg>
              </button>
              <button id="leaveButton" type="button" class="inline-flex size-11 items-center justify-center rounded-full border border-x-border text-x-ink hover:bg-x-hover" aria-label="Leave" title="Leave">
                <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M14 7V5H5v14h9v-2"/><path stroke-linecap="round" stroke-linejoin="round" d="M10 12h9M16 9l3 3-3 3"/></svg>
              </button>
              <button id="endButton" type="button" class="hidden" aria-label="End" data-show="inline-flex size-11 items-center justify-center rounded-full bg-x-danger text-white hover:bg-[#d61f2a]">
                <svg viewBox="0 0 24 24" class="size-5 rotate-[135deg]" fill="currentColor" aria-hidden="true"><path d="M7.1 3.8c.5-.9 1.6-1.2 2.5-.7l1.5.8c.8.4 1.1 1.4.7 2.2l-.5 1.1c-.2.5 0 1 .4 1.3l2.8 2.2c.4.3.5.8.3 1.3l-.5 1.1c-.4.8-.1 1.8.7 2.2l1.5.8c.9.5 2 .1 2.5-.8l.6-1.1c.6-1.1 2-1.5 3-.9 1.6 1 2.2 3.1 1.3 4.8-1.4 2.6-4.6 4.3-7.6 3.4-5.2-1.5-9.3-6.2-10.2-11.5-.5-2.8.8-5.6 3.1-6.8l.9-.4z"/></svg>
              </button>
            </div>
            <div id="reactionBar" class="flex items-center justify-end"></div>
          </div>
        </div>
      </section>

      <aside class="flex max-h-[46vh] w-full min-w-0 shrink-0 flex-col border-t border-x-line lg:max-h-none lg:h-svh lg:w-[340px] lg:border-t-0 lg:border-l">
        <div id="inviteBox" class="hidden" data-show="border-b border-x-line px-4 py-3"></div>
        <div class="min-h-0 flex-1 overflow-y-auto px-2 py-2">
          <h2 class="px-3 pt-2 pb-1 text-[15px] font-extrabold">People</h2>
          <div id="peopleList"></div>
          <h2 class="mx-3 mt-2 border-t border-x-line px-0 pt-3 pb-1 text-[15px] font-extrabold">Raised hands</h2>
          <div id="handsList"></div>
          <h2 class="mx-3 mt-2 border-t border-x-line px-0 pt-3 pb-1 text-[15px] font-extrabold">Chat</h2>
          <div id="messages" class="max-h-64 overflow-y-auto lg:max-h-none">
            <p id="chatEmpty" class="px-4 py-3 text-[15px] text-x-muted">No messages yet.</p>
          </div>
        </div>
        <form id="chatForm" class="border-t border-x-line p-4">
          <div class="flex items-center gap-2">
            <label class="min-w-0 flex-1">
              <span class="sr-only">Message</span>
              <input id="chatText" type="text" maxlength="1000" placeholder="Chat starts when the room is live" disabled class="h-10 w-full rounded-full border border-transparent bg-x-chip px-4 text-[15px] outline-none placeholder:text-x-muted focus:border-x-blue focus:bg-white disabled:opacity-60">
            </label>
            <button id="chatSend" type="submit" disabled class="x-btn-blue h-9 px-4 text-[15px] disabled:opacity-50">Send</button>
          </div>
          <p id="chatNotice" class="mt-2 hidden text-[13px] text-x-danger" role="status"></p>
        </form>
      </aside>
    </div>
  </div>

        <a href="blogs.html" class="shrink-0 rounded-full p-3" aria-label="Blogs">
