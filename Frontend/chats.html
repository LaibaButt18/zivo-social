  <script src="./api.js"></script>
  <script>
    var chats = [];
    var peoplePicker = mountUserSearch(document.getElementById('chatPeoplePicker'), {
      multiple: true,
      max: 31,
      inset: false,
      placeholder: 'Search by name or username',
    });

    function picture(src, letter, sizeClass) {
      if (src) {
        var img = document.createElement('img');
        img.src = API + src;
        img.alt = '';
        img.className = 'shrink-0 rounded-full object-cover ' + sizeClass;
        return img;
      }
      var fallback = document.createElement('span');
      fallback.className = 'flex shrink-0 items-center justify-center rounded-full bg-x-blue text-sm font-bold text-white ' + sizeClass;
      fallback.textContent = (letter || 'C').toUpperCase();
      return fallback;
    }

    function imageProblem(file) {
      if (!file) return '';
      var types = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
      if (types.indexOf(file.type) === -1 || file.size === 0 || file.size > 2 * 1024 * 1024) {
        return 'Use a jpg, png, gif, or webp under 2 MB.';
      }
      return '';
    }

    function showNotice(text) {
      var notice = document.getElementById('createNotice');
      if (!text) {
        notice.classList.add('hidden');
        notice.textContent = '';
        return;
      }
      notice.classList.remove('hidden');
      notice.textContent = text;
    }

    function paint() {
      var box = document.getElementById('chats');
      box.innerHTML = '';
      if (!chats.length) {
        var empty = document.createElement('div');
        empty.className = 'px-8 py-12';
        var title = document.createElement('h2');
        title.className = 'text-[31px] leading-9 font-extrabold';
        title.textContent = 'No chats yet';
        var copy = document.createElement('p');
        copy.className = 'mt-2 max-w-sm text-[15px] leading-5 text-x-muted';
        copy.textContent = 'Start a group chat and message the people in it.';
        empty.appendChild(title);
        empty.appendChild(copy);
        box.appendChild(empty);
        return;
      }
      chats.forEach(function (chat) {
        var link = document.createElement('a');
        link.href = 'chat.html?id=' + encodeURIComponent(chat.id);
        link.className = 'flex items-center gap-3 border-b border-x-line px-4 py-3 hover:bg-black/[0.03]';
        link.appendChild(picture(chat.photo, (chat.name || 'C').charAt(0), 'size-14'));
        var copy = document.createElement('div');
        copy.className = 'min-w-0 flex-1';
        var row = document.createElement('div');
        row.className = 'flex items-center gap-2';
        var name = document.createElement('p');
        name.className = 'min-w-0 flex-1 truncate text-[15px] ' + (chat.unread ? 'font-extrabold' : 'font-bold');
        name.textContent = chat.name;
        row.appendChild(name);
        if (chat.unread) {
          var badge = document.createElement('span');
          badge.className = 'inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-x-blue px-1.5 text-[12px] font-bold text-white';
          badge.textContent = String(chat.unread);
          row.appendChild(badge);
        }
        var preview = document.createElement('p');
        preview.className = 'truncate text-[15px] ' + (chat.unread ? 'font-bold text-x-ink' : 'text-x-muted');
        var last = chat.last_message;
        if (!last) preview.textContent = chat.member_count + (chat.member_count === 1 ? ' person' : ' people');
        else if (last.system) preview.textContent = last.preview;
        else preview.textContent = (last.mine ? 'You: ' : last.name + ': ') + last.preview;
        copy.appendChild(row);
        copy.appendChild(preview);
        link.appendChild(copy);
        box.appendChild(link);
      });
    }

    function loadChats() {
      return apiFetch('/chats').then(function (result) {
        if (result.status === 401) {
          clearToken();
          window.location.href = 'loginpage.html';
          return;
        }
        chats = Array.isArray(result.data) ? result.data : [];
        paint();
      });
    }

    if (!localStorage.getItem('zivo_token')) {
      window.location.href = 'loginpage.html';
    } else {
      apiFetch('/me').then(function (result) {
        if (!result.ok) {
          clearToken();
          window.location.href = 'loginpage.html';
          return;
        }
        document.getElementById('greeting').textContent = result.data.name;
        if (result.data.premium) document.getElementById('greeting').appendChild(premiumMark());
        document.getElementById('mePhoto').appendChild(picture(result.data.photo, (result.data.name || '?').charAt(0), 'size-10'));
        if (result.data.username) document.getElementById('handle').textContent = '@' + result.data.username;
        return loadChats();
      }).catch(function () {
        window.location.href = 'loginpage.html';
      });
    }

    document.getElementById('newChat').addEventListener('click', function () {
      var form = document.getElementById('createForm');
      form.classList.toggle('hidden');
      if (!form.classList.contains('hidden')) document.getElementById('chatName').focus();
    });
    document.getElementById('createCancel').addEventListener('click', function () {
      document.getElementById('createForm').classList.add('hidden');
      document.getElementById('chatName').value = '';
      peoplePicker.clear();
      document.getElementById('chatPhoto').value = '';
      document.getElementById('chatPhotoName').textContent = '';
      showNotice('');
    });
    document.getElementById('chatPhoto').addEventListener('change', function () {
      var file = this.files[0];
      var problem = imageProblem(file);
      if (problem) {
        this.value = '';
        document.getElementById('chatPhotoName').textContent = '';
        showNotice(problem);
        return;
      }
      showNotice('');
      document.getElementById('chatPhotoName').textContent = file ? file.name : '';
    });
    document.getElementById('createForm').addEventListener('submit', function (event) {
      event.preventDefault();
      var name = document.getElementById('chatName').value.trim();
      var people = peoplePicker.getSelected().map(function (person) { return person.email; }).join(', ');
      var file = document.getElementById('chatPhoto').files[0];
      if (!name) {
        showNotice('Chat name cannot be empty.');
        return;
      }
      if (name.length > 50) {
        showNotice('Chat name can be 50 characters at most.');
        return;
      }
      var problem = imageProblem(file);
      if (problem) {
        showNotice(problem);
        return;
      }
      var body = new FormData();
      body.append('name', name);
      body.append('members', people);
      if (file) body.append('photo', file);
      var button = document.getElementById('createSubmit');
      button.disabled = true;
      apiForm('/chats', body).then(function (result) {
        button.disabled = false;
        if (!result.ok) {
          showNotice(result.data.message || 'Could not create that chat.');
          return;
        }
        window.location.href = 'chat.html?id=' + encodeURIComponent(result.data.id);
      }).catch(function () {
        button.disabled = false;
        showNotice('Cannot reach the server.');
      });
    });

    document.addEventListener('click', function (event) {
      var pop = document.getElementById('accountPopover');
      var toggle = document.getElementById('accountToggle');
      if (toggle.contains(event.target)) {
        pop.classList.toggle('hidden');
        return;
      }
      if (!pop.contains(event.target)) pop.classList.add('hidden');
    });
    document.getElementById('logout').addEventListener('click', function () {
      apiFetch('/logout', { method: 'POST', body: '{}' }).finally(function () {
        clearToken();
        window.location.href = 'loginpage.html';
      });
    });
  </script>
