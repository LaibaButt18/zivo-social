  <script src="./api.js"></script>
  <script src="./posts.js"></script>
  <script>
    let viewed = null;
    let meEmail = '';

    function picture(src, letter, sizeClass) {
      if (src) {
        const img = document.createElement('img');
        img.src = API + src;
        img.alt = '';
        img.className = 'shrink-0 rounded-full object-cover ' + sizeClass;
        return img;
      }
      const fallback = document.createElement('span');
      fallback.className = 'flex shrink-0 items-center justify-center rounded-full bg-x-blue font-bold text-white ' + sizeClass;
      fallback.textContent = (letter || '?').toUpperCase();
      return fallback;
    }

    function profileHref(username, email) {
      const key = username || email || '';
      if (!key) return 'profile.html';
      return 'profile.html?user=' + encodeURIComponent(key);
    }

    function stat(count, label) {
      const item = document.createElement('span');
      const strong = document.createElement('span');
      strong.className = 'font-bold text-x-ink';
      strong.textContent = String(count);
      item.appendChild(strong);
      item.appendChild(document.createTextNode(' ' + label));
      return item;
    }

    function renderPosts(posts, isSelf) {
      const box = document.getElementById('posts');
      box.innerHTML = '';
      if (!posts.length) {
        const empty = document.createElement('div');
        empty.className = 'px-8 py-12';
        const title = document.createElement('h2');
        title.className = 'text-[31px] leading-9 font-extrabold';
        title.textContent = isSelf ? 'You haven’t posted yet' : 'No posts yet';
        const copy = document.createElement('p');
        copy.className = 'mt-2 max-w-sm text-[15px] leading-5 text-x-muted';
        copy.textContent = isSelf
          ? 'When you post, it will show up here.'
          : 'When they post, their posts will show up here.';
        empty.appendChild(title);
        empty.appendChild(copy);
        box.appendChild(empty);
        return;
      }

      posts.forEach(function (post) {
        const href = profileHref(post.username, post.email);
        const article = document.createElement('article');
        article.className = 'flex gap-3 border-b border-x-line px-4 py-3 transition-colors hover:bg-black/[0.03]';

        const avatarLink = document.createElement('a');
        avatarLink.href = href;
        avatarLink.className = 'shrink-0';
        avatarLink.appendChild(picture(post.photo, (post.name || '?').charAt(0), 'size-10 text-sm'));
        article.appendChild(avatarLink);

        const body = document.createElement('div');
        body.className = 'min-w-0 flex-1';
        const head = document.createElement('div');
        head.className = 'flex items-start gap-1';
        const who = document.createElement('p');
        who.className = 'flex min-w-0 flex-1 items-baseline gap-1 text-[15px]';
        const name = document.createElement('a');
        name.href = href;
        name.className = 'truncate font-bold hover:underline';
        name.textContent = post.name;
        who.appendChild(name);
        if (post.premium) who.appendChild(premiumMark());
        if (post.username) {
          const handle = document.createElement('a');
          handle.href = href;
          handle.className = 'truncate text-x-muted hover:underline';
          handle.textContent = '@' + post.username;
          who.appendChild(handle);
        }
        head.appendChild(who);
        body.appendChild(head);
        const text = document.createElement('p');
        text.className = 'text-[15px] leading-5 break-words whitespace-pre-wrap';
        if (post.text) text.textContent = post.text;
        else text.classList.add('hidden');
        body.appendChild(text);
        mountPostMenu(head, post, {
          meEmail: meEmail,
          textEl: text,
          onDeleted: function () {
            if (!viewed) return;
            viewed.posts = viewed.posts.filter(function (item) { return item.id !== post.id; });
            const count = viewed.posts.length;
            document.getElementById('headerCount').textContent = count + (count === 1 ? ' post' : ' posts');
            renderPosts(viewed.posts, viewed.is_self);
          },
        });
        mountPostMedia(body, post, function (updated) {
          if (!viewed) return;
          viewed.posts = viewed.posts.map(function (item) { return item.id === updated.id ? updated : item; });
          renderPosts(viewed.posts, viewed.is_self);
        });
        article.appendChild(body);
        mountPostActions(body, post, {
          picture: picture,
          profileHref: profileHref,
          meEmail: meEmail,
        });
        box.appendChild(article);
      });
    }

    function renderAction(profile) {
      const box = document.getElementById('profileAction');
      box.innerHTML = '';
      if (profile.is_self) {
        const edit = document.createElement('a');
        edit.href = 'settings.html';
        edit.className = 'inline-flex rounded-full border border-x-border px-4 py-1.5 text-[15px] font-bold hover:bg-x-hover';
        edit.textContent = 'Edit profile';
        box.appendChild(edit);
        return;
      }

      const button = document.createElement('button');
      button.type = 'button';
      if (profile.following) {
        button.className = 'btn-following';
        button.innerHTML = '<span class="label-follow">Following</span><span class="label-unfollow">Unfollow</span>';
      } else {
        button.className = 'btn-follow';
        button.textContent = 'Follow';
      }
      button.addEventListener('click', function () {
        const path = profile.following ? '/unfollow' : '/follow';
        apiFetch(path, {
          method: 'POST',
          body: JSON.stringify({ user: profile.email }),
        }).then(function (result) {
          if (!result.ok) return;
          loadProfile();
          loadPeople();
        });
      });
      box.appendChild(button);
    }

    function renderProfile(profile) {
      viewed = profile;
      const count = profile.posts.length;
      document.title = profile.name + ' | Zivo';
      document.getElementById('headerName').textContent = profile.name;
      document.getElementById('headerCount').textContent = count + (count === 1 ? ' post' : ' posts');
      const nameEl = document.getElementById('profileName');
      nameEl.textContent = '';
      nameEl.appendChild(document.createTextNode(profile.name));
      if (profile.premium) nameEl.appendChild(premiumMark());
      document.getElementById('profileHandle').textContent = profile.username ? '@' + profile.username : '';

      const bio = document.getElementById('profileBio');
      if (profile.bio) {
        bio.textContent = profile.bio;
        bio.classList.remove('hidden');
      } else {
        bio.textContent = '';
        bio.classList.add('hidden');
      }

      const cover = document.getElementById('coverImage');
      if (profile.cover) {
        cover.src = API + profile.cover;
        cover.classList.remove('hidden');
      } else {
        cover.removeAttribute('src');
        cover.classList.add('hidden');
      }

      const avatar = document.getElementById('profileAvatar');
      avatar.innerHTML = '';
      avatar.appendChild(picture(profile.photo, profile.name.charAt(0), 'size-28 text-3xl sm:size-32'));

      const stats = document.getElementById('profileStats');
      stats.innerHTML = '';
      stats.appendChild(stat(profile.following_count, 'Following'));
      const followers = profile.followers_count;
      stats.appendChild(stat(followers, followers === 1 ? 'Follower' : 'Followers'));

      renderAction(profile);
      renderPosts(profile.posts, profile.is_self);

      const mine = profile.is_self;
      document.getElementById('navProfile').classList.toggle('font-bold', mine);
      document.getElementById('navProfile').setAttribute('aria-current', mine ? 'page' : 'false');
    }

    function loadProfile() {
      const params = new URLSearchParams(window.location.search);
      const user = params.get('user');
      const path = user ? '/profile/' + encodeURIComponent(user) : '/profile';
      return apiFetch(path).then(function (result) {
        if (result.status === 401) {
          clearToken();
          window.location.href = 'loginpage.html';
          return;
        }
        if (!result.ok) {
          document.getElementById('profileBody').classList.add('hidden');
          document.getElementById('missing').classList.remove('hidden');
          document.getElementById('headerName').textContent = 'Profile';
          return;
        }
        document.getElementById('profileBody').classList.remove('hidden');
        document.getElementById('missing').classList.add('hidden');
        renderProfile(result.data);
      });
    }

    function renderPeople(people) {
      const box = document.getElementById('people');
      box.innerHTML = '';
      const list = people.filter(function (person) {
        if (!viewed) return true;
        return person.email !== viewed.email;
      }).slice(0, 3);

      if (!list.length) {
        const empty = document.createElement('p');
        empty.className = 'px-4 py-4 text-[15px] text-x-muted';
        empty.textContent = people.length ? 'No other accounts to show.' : 'No one else has joined yet.';
        box.appendChild(empty);
        return;
      }

      list.forEach(function (person) {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-3 px-4 py-3';
        const link = document.createElement('a');
        link.href = profileHref(person.username, person.email);
        link.className = 'flex min-w-0 flex-1 items-center gap-3 rounded-full hover:underline';
        link.appendChild(picture(person.photo, (person.name || '?').charAt(0), 'size-10 text-sm'));
        const copy = document.createElement('span');
        copy.className = 'min-w-0';
        const name = document.createElement('span');
        name.className = 'block text-[15px] font-bold break-words';
        if (person.premium) {
          const nameRow = document.createElement('span');
          nameRow.className = 'flex items-center gap-1';
          name.textContent = person.name;
          nameRow.appendChild(name);
          nameRow.appendChild(premiumMark());
          copy.appendChild(nameRow);
        } else {
          name.textContent = person.name;
          copy.appendChild(name);
        }
        const handle = document.createElement('span');
        handle.className = 'block text-[15px] break-words text-x-muted';
        handle.textContent = person.username ? '@' + person.username : '';
        copy.appendChild(handle);
        link.appendChild(copy);
        row.appendChild(link);
        box.appendChild(row);
      });
    }

    function loadPeople() {
      return apiFetch('/users').then(function (result) {
        if (!result.ok) return;
        renderPeople(Array.isArray(result.data) ? result.data : []);
      });
    }

    if (!localStorage.getItem('zivo_token')) {
      window.location.href = 'loginpage.html';
    } else {
      apiFetch('/me')
        .then(function (result) {
          if (!result.ok) {
            clearToken();
            window.location.href = 'loginpage.html';
            return;
          }
          meEmail = result.data.email || '';
          document.getElementById('navName').textContent = result.data.name;
          if (result.data.username) {
            document.getElementById('navHandle').textContent = '@' + result.data.username;
          }
          const photo = document.getElementById('navPhoto');
          photo.appendChild(picture(result.data.photo, result.data.name.charAt(0), 'size-10 text-sm'));
          return Promise.all([loadProfile(), loadPeople()]);
        })
        .catch(function () {
          window.location.href = 'loginpage.html';
        });
    }

    document.getElementById('backLink').addEventListener('click', function (e) {
      if (window.history.length > 1) {
        e.preventDefault();
        window.history.back();
      }
    });

    document.addEventListener('click', function (e) {
      const pop = document.getElementById('accountPopover');
      const toggle = document.getElementById('accountToggle');
      if (toggle.contains(e.target)) {
        pop.classList.toggle('hidden');
        return;
      }
      if (!pop.contains(e.target)) pop.classList.add('hidden');
    });

    document.getElementById('logout').addEventListener('click', function () {
      apiFetch('/logout', { method: 'POST', body: '{}' })
        .finally(function () {
          clearToken();
          window.location.href = 'loginpage.html';
        });
    });
  </script>
</body>
</html>
