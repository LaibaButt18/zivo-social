<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="./theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset link | Zivo</title>
  <meta name="theme-color" content="#0f1419">
  <link rel="icon" href="./assets/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="x-page z-shell">
  <div class="mx-auto flex min-h-svh w-full max-w-[600px] flex-col px-8 py-6 sm:px-16">
    <div class="mb-6 flex items-center justify-between" data-theme-host>
      <a href="loginpage.html" class="w-fit rounded-full p-2 hover:bg-x-hover" aria-label="Back">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
    </div>
    <span class="mb-6 inline-flex items-center gap-2.5">
      <img src="./assets/logo-mark.svg" alt="" class="size-8">
      <span class="text-[22px] font-extrabold leading-none tracking-[-0.03em]">Zivo</span>
    </span>
    <h1 class="text-[31px] leading-9 font-extrabold">Find your Zivo account</h1>
    <p class="mt-2 text-[15px] leading-5 text-x-muted">Enter the email for your account. If it has an account, we send a reset link that lasts 30 minutes. Check your inbox and spam folder.</p>
    <form id="forgetForm" class="mt-8 space-y-5">
      <label class="block">
        <span class="mb-1.5 block text-[15px] font-medium">Email</span>
        <input id="email" type="email" placeholder="Email" autocomplete="email" required class="x-input">
      </label>
      <button type="submit" class="x-btn">Next</button>
      <div id="notice" class="hidden text-[15px] leading-5 text-x-ink" role="status"></div>
    </form>
    <p class="mt-10 text-[15px] text-x-muted">
      <a href="loginpage.html" class="x-link">Return to sign in</a>
      <span class="mx-2">·</span>
      <a href="resetpassword.html" class="x-link">I already have a link</a>
    </p>
  </div>
  <script src="./api.js"></script>
  <script>
    requireGuest();
    document.getElementById('forgetForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const notice = document.getElementById('notice');
      const button = e.target.querySelector('button');
      notice.className = 'text-[15px] leading-5 text-x-ink';
      notice.classList.remove('hidden');
      button.disabled = true;
      apiFetch('/forgot', {
        method: 'POST',
        body: JSON.stringify({ email: document.getElementById('email').value }),
      })
        .then(function (result) {
          button.disabled = false;
          if (!result.ok) {
            notice.className = 'text-[15px] leading-5 text-x-danger';
            notice.textContent = result.data.message || 'Could not start that reset.';
            return;
          }
          notice.className = 'text-[15px] leading-5 text-x-ink';
          notice.textContent = result.data.message;
        })
        .catch(function () {
          button.disabled = false;
          notice.className = 'text-[15px] leading-5 text-x-danger';
          notice.textContent = 'Cannot reach the server.';
        });
    });
  </script>
</body>
</html>
